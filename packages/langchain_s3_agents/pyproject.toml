[tool.coverage.run]
branch = true
source = [ "my_py_agents_langchain_s3_agents" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/langchain_s3_agents/html'
 --cov-report xml:'../../coverage/packages/langchain_s3_agents/coverage.xml'
 --html='../../reports/packages/langchain_s3_agents/unittests/html/index.html'
 --junitxml='../../reports/packages/langchain_s3_agents/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "my_py_agents_langchain_s3_agents" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources.my-py-agents-agent-connection]
workspace = true

[project]
name = "my-py-agents-langchain-s3-agents"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "my-py-agents-agent-connection",
  "aws-lambda-powertools==3.31.1",
  "aws-opentelemetry-distro==0.19.0",
  "bedrock-agentcore==1.21.0",
  "boto3==1.43.67",
  "fastapi==0.141.1",
  "mcp==1.28.1",
  "langchain==1.3.14",
  "langchain-aws==1.7.0",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.1",
  "aiosqlite==0.22.1",
  "uvicorn==0.52.1",
  "a2a-sdk==0.3.26",
  "ag-ui-protocol==0.1.19",
  "ag-ui-langgraph==0.0.42"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.141.1" ]
