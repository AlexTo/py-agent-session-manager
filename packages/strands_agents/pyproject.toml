[tool.coverage.run]
branch = true
source = [ "my_py_agents_strands_agents" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/strands_agents/html'
 --cov-report xml:'../../coverage/packages/strands_agents/coverage.xml'
 --html='../../reports/packages/strands_agents/unittests/html/index.html'
 --junitxml='../../reports/packages/strands_agents/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "my_py_agents_strands_agents" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 120
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[tool.uv.sources.my-py-agents-agent-connection]
workspace = true

[project]
name = "my-py-agents-strands-agents"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
  "my-py-agents-agent-connection",
  "aws-lambda-powertools==3.31.1",
  "aws-opentelemetry-distro==0.18.0",
  "bedrock-agentcore==1.18.1",
  "boto3==1.43.51",
  "fastapi==0.139.2",
  "mcp==1.28.1",
  "strands-agents==1.48.0",
  "strands-agents-tools==0.8.4",
  "uvicorn==0.51.0",
  "strands-agents[a2a]==1.48.0",
  "ag-ui-protocol==0.1.19",
  "ag-ui-strands==0.2.2"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [ "fastapi[standard]==0.139.2" ]
